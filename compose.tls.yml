# Use with compose.yml and compose.scale.yml. Supply a real certificate and trusted proxy IPs.
services:
  proxy:
    ports:
      - "${TLS_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./docker/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the certificate directory}:/etc/nginx/tls:ro
