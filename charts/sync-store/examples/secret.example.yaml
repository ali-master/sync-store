# Documentation template only: replace ALL placeholders outside version control.
# Create this Secret before helm install; the migration hook needs it immediately.
apiVersion: v1
kind: Secret
metadata:
  name: sync-store-production
type: Opaque
stringData:
  DATABASE_URL: "mongodb://APP_USER:URL_ENCODED_PASSWORD@db.example.com:27017/syncstore?authSource=syncstore&replicaSet=rs0"
  JWT_SECRET: "REPLACE_WITH_A_RANDOM_SECRET"
  CSRF_SECRET: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  # Required for multiple application replicas; Redis 7.2+ with AOF and WAITAOF.
  REDIS_URL: "rediss://default:URL_ENCODED_PASSWORD@redis.example.com:6379"
  # Optional: only for confidential OIDC dashboard clients.
  # SSO_CLIENT_SECRET: "REPLACE_WITH_YOUR_OIDC_CLIENT_SECRET"
  # Optional: bearer token for monitoring access.
  # METRICS_TOKEN: "REPLACE_WITH_A_RANDOM_MONITORING_TOKEN"
