services:
  mongodb:
    image: mongo:9.0.4
    entrypoint: ["bash", "/opt/sync-mongo/start.sh"]
    environment:
      MONGO_REPLICA_HOST: localhost:27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb:/opt/sync-mongo:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "/opt/sync-mongo/ready.js"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
